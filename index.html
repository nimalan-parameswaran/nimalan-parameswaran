<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b1a">
  <title>Cat Sky Adventure — Meow Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-lockup">
        <a class="brand" href="./" aria-label="Cat Sky Adventure home">
          <img src="cat.png" alt="" width="34" height="34">
          <span>FLAPPY//FLIGHT</span>
        </a>
        <span class="brand-caption">CAT SKY ADVENTURE</span>
      </div>
      <div class="stats" aria-live="polite">
        <span>SCORE <b id="score">000000</b></span>
        <span>BEST <b id="best">000000</b></span>
        <span>LEVEL <b id="level">1</b></span>
      </div>
    </header>

    <section class="game-panel" aria-label="Cat Sky Adventure game">
      <canvas id="game" width="1100" height="620" aria-label="Cat flight play area"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="eyebrow">MEOW-COME ABOARD</p>
          <img class="hero-logo" src="cat.png" alt="Cat pilot logo" width="104" height="104">
          <h1 id="overlay-title">FLAPPY FLIGHT</h1>
          <p id="overlay-copy">Help this very serious cat dodge pipes and collect snacks.</p>
          <button id="start-button" type="button">LET'S MEOW!</button>
          <small>Click, tap, SPACE, or ↑ to flap · P pauses</small>
          <small class="mobile-hint">Tap anywhere to flap</small>
        </div>
      </div>
      <div class="touch-controls" aria-label="Touch controls">
        <button id="fire-button" type="button">TAP<br>TO FLAP</button>
      </div>
      <div class="funny-message" id="funny-message" aria-live="polite">Purr-powered and ready!</div>
    </section>

    <footer>
      <span>CAT SKY ADVENTURE</span>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
